[workspace]
channels = ["conda-forge"]
name = "finetune-qlora"
platforms = ["linux-64"]
version = "0.1.0"

# QLoRA fine-tune of a small causal LM. Ship this whole directory to a GPU-backed rixi
# server (see README.md); the server resolves this env and runs the `finetune` task.

[tasks]
finetune = "python train.py"

# Target a CUDA GPU host (lets the lock resolve GPU builds even when generated off a GPU box).
[system-requirements]
cuda = "12"

[dependencies]
python = ">=3.10,<3.12"
pytorch-gpu = ">=2.2,<2.6"
transformers = ">=4.40"
datasets = ">=2.19"
accelerate = ">=0.30"

[pypi-dependencies]
peft = ">=0.11"
bitsandbytes = ">=0.43"
