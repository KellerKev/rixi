[workspace]
channels = ["conda-forge"]
name = "rixi-server"
platforms = ["linux-64", "osx-arm64", "osx-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
test = "pytest tests/ -v"

[dependencies]
python = ">=3.12"
fastapi = ">=0.121,<0.130"
# 0.47.2 fixes the multipart upload that blocks the event loop (CVE-2025-54121); 0.49.1 the
# Range-header one on file responses (CVE-2025-62727)
starlette = ">=0.49.1"
uvicorn = ">=0.34.2,<0.35"
python-multipart = ">=0.0.20,<0.0.21"
lz4 = ">=4.4.4,<5"
requests = ">=2.32.3,<3"
tqdm = ">=4.67.1,<5"
pyjwt = ">=2.10.1,<3"
cryptography = ">=44.0.3,<45"
pytest = ">=8"
websockets = ">=13"
