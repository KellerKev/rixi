[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rixi"
version = "0.2.1"
description = "Secure remote execution for Pixi projects — client SDK and CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kevin Keller" }]
keywords = ["pixi", "remote-execution", "gpu", "mlops", "inference", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "requests>=2.28",
    "cryptography>=44",
    "lz4>=4.0",
]

[project.urls]
Homepage = "https://github.com/KellerKev/rixi"
Repository = "https://github.com/KellerKev/rixi"

[project.optional-dependencies]
# Server-side components carry heavy deps; installing them via pip is best-effort — the
# supported path is Pixi per component. These extras exist so `rixi-server`/`rixi-gateway`
# launchers can run from a plain venv when desired.
server = ["fastapi>=0.115,<0.116", "uvicorn>=0.30", "pyjwt>=2.10,<3", "python-multipart>=0.0.9"]
gateway = ["fastapi", "uvicorn", "pyjwt>=2.8", "websockets>=12", "duckdb>=0.10", "tomli>=2; python_version < '3.11'"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rixi = "rixi._cli:main"
rixi-server = "rixi._launchers:server"
rixi-client = "rixi._launchers:client"
rixi-tunnel = "rixi._launchers:tunnel"
rixi-agent = "rixi._launchers:agent"
rixi-proxy = "rixi._launchers:proxy"
rixi-inference = "rixi._launchers:inference"
rixi-gateway = "rixi._launchers:gateway"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
