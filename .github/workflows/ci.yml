name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .

  shellcheck:
    name: ShellCheck scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck all shell scripts
        run: shellcheck install-rixi.sh bootstrap.sh provision-scaleway-gpu.sh docker-entrypoint.sh

  compile:
    name: Byte-compile sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile all Python sources
        run: python -m compileall -q -x '\.pixi' src server clients agent proxy inference-server tunnel gateway examples

  sdk:
    name: SDK unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package (editable) + dev deps
        run: pip install -e '.[server,dev]'
      - name: Test the client SDK
        run: pytest tests/ -q
      - name: Server security regression tests
        run: pytest server/tests/ -q

  gateway:
    name: Gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 15     # the suite takes ~30s; a hang should fail fast, not run for 6 hours
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          manifest-path: gateway/pixi.toml
      - name: Run gateway tests
        run: pixi run test
        working-directory: gateway

  metaflow-rixi:
    name: Metaflow @rixi extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the rixi SDK + the metaflow extension
        run: |
          pip install -e '.[dev]'
          pip install -e ./metaflow-rixi
      - name: Test the @rixi extension
        run: pytest metaflow-rixi/tests/ -q

  agent:
    name: Agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          manifest-path: agent/pixi.toml
      - name: Run agent tests
        run: pixi run test
        working-directory: agent

  install-from-git:
    name: Install the way users do
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # rixi is not on PyPI yet, so the documented install is a git URL. Prove that the
      # built package works on its own: a clean venv, the console script, and a real task
      # run against a real server.
      - name: Install into a clean venv (from this checkout, as pip would build it)
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install -q ".[server]"
      - name: The console script runs and reports the release version
        run: |
          /tmp/v/bin/rixi --version
          test "$(/tmp/v/bin/rixi --version)" = "rixi $(grep -m1 '^version = ' pyproject.toml | cut -d\" -f2)"
      - name: A task runs end to end through the installed client
        run: |
          mkdir -p /tmp/stub /tmp/proj
          printf '#!/bin/sh\nshift 2\nexec sh run.sh\n' > /tmp/stub/pixi
          chmod +x /tmp/stub/pixi
          printf '#!/bin/sh\necho hello from the task\n' > /tmp/proj/run.sh
          PATH=/tmp/stub:$PATH /tmp/v/bin/python server/rixi_server.py --port 9123 \
            --log-dir /tmp/logs &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9123/health && break; sleep 1; done
          out=$(/tmp/v/bin/rixi run --server http://127.0.0.1:9123 --task run /tmp/proj)
          echo "$out"
          echo "$out" | grep -q "hello from the task"
      - name: Install from the git URL itself (the documented command)
        if: github.event_name == 'push'
        run: |
          python -m venv /tmp/g
          /tmp/g/bin/pip install -q "git+${{ github.server_url }}/${{ github.repository }}@${{ github.sha }}"
          /tmp/g/bin/rixi --help > /dev/null
