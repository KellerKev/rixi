# Pixi environment the rixi box resolves to RUN the @rixi `train` step (used ON THE BOX). It needs
# scikit-learn (the model), Metaflow + boto3 (the S3 datastore), and the @rixi decorator so the flow
# imports. `metaflow-rixi` is a path dep the `rixi step` CLI populates in the shipped bundle
# (self-contained, no PyPI needed). The orchestrator (your laptop) runs start/end in its own env.
[workspace]
channels = ["conda-forge"]
name = "rixi-regulatory-extractor"
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]
version = "0.1.0"

[dependencies]
python = ">=3.10,<3.13"

[pypi-dependencies]
scikit-learn = ">=1.3"
metaflow = ">=2.12"
boto3 = ">=1.28"
metaflow-rixi = { path = "_deps/metaflow-rixi", editable = false }
